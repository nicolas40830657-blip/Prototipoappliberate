<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liberate – Prototipo v6</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3e6;--card:#fff;--tx:#10170f;--mu:#5b6a58;--bd:#cfdcc2;--ac:#2f7d3b;--acx:#fff;--lt:#a7d676;--ok:#2f7d3b;--okb:#dcf0cf;--no:#c93c3c;--nob:#fbe1e1;--wab:#fdf0d5;--wa:#a8680f;--gr:#e4ecd9;--px:'Press Start 2P',ui-monospace,monospace;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1810;--card:#162319;--tx:#eef5e8;--mu:#97ab93;--bd:#263a29;--ac:#7fd05a;--acx:#0e1810;--lt:#2f5a32;--ok:#6fd37a;--okb:#18331d;--no:#ff7b7b;--nob:#3a1d1d;--wab:#3a2e14;--wa:#f0b955;--gr:#1f2f22}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding:14px 14px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-family:var(--px);font-size:15px}.logo span{color:var(--ac)}
.role{display:flex;background:var(--gr);border-radius:99px;padding:3px}
.role button{border:0;background:none;color:var(--mu);padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer}
.role button.on{background:var(--ac);color:var(--acx)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:10px;border-radius:12px;font-weight:700;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.scene{position:relative;margin-bottom:12px}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--tx);border-radius:14px;background:#8fd3f4}
.hud{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.hud .pill{background:rgba(255,255,255,.92);color:#10170f;font-family:var(--px);font-size:9px;padding:6px 8px;border:2px solid #10170f}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ovl b{background:#10170f;color:#fff;font-family:var(--px);font-size:10px;line-height:1.6;padding:12px 14px;text-align:center;border-radius:6px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}.sm{font-size:13px}
h2{font-size:19px;margin-bottom:2px}h3{font-size:15px;margin-bottom:8px}
.big{display:flex;gap:10px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;flex:1;background:var(--gr);color:var(--tx)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}.btn.ac{background:var(--ac);color:var(--acx)}
.btn.out{background:none;border:2px solid var(--bd)}.btn.sel{outline:3px solid var(--tx)}
a.btn{display:block;text-align:center;text-decoration:none}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.p-ok{background:var(--okb);color:var(--ok)}.p-no{background:var(--nob);color:var(--no)}.p-wa{background:var(--wab);color:var(--wa)}.p-gr{background:var(--gr);color:var(--mu)}
.alert{background:var(--wab);color:var(--wa);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;margin:10px 0 14px}
.chip{flex:1;border:2px solid var(--bd);background:none;color:var(--tx);border-radius:12px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:40px repeat(5,1fr);gap:6px;align-items:center}
.grid .h{text-align:center;font-weight:700;font-size:13px;color:var(--mu)}
.cell{aspect-ratio:1;border-radius:10px;border:2px dashed var(--bd);background:none;cursor:pointer;font-size:18px;color:var(--mu)}
.cell.on{border:2px solid var(--ac);background:var(--ac);color:var(--acx)}.cell.sel{box-shadow:0 0 0 3px var(--tx)}
.cnt{display:flex;gap:8px;margin:12px 0}.cnt div{flex:1;text-align:center;border-radius:14px;padding:10px 4px}.cnt b{display:block;font-size:26px}.cnt span{font-size:12px;font-weight:600}
textarea{width:100%;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px;font:inherit;resize:none;margin-top:6px}
.stu{padding:10px 0;border-top:1px solid var(--bd)}.stu:first-of-type{border-top:0}
.mini{border:2px solid var(--bd);background:none;color:var(--tx);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.mini.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:90%;z-index:9;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:14px}

.full{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:1}
.full .hud{top:calc(12px + env(safe-area-inset-top,0px));left:10px;flex-wrap:wrap;max-width:66%}
.pill.lg{font-size:10px!important;color:#2f7d3b!important}
.demo{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:10px;background:rgba(255,255,255,.92);color:#10170f;border:2px solid #10170f;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--card);border-top:2px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--px);font-size:7px;line-height:1.5;padding:6px 2px;cursor:pointer;text-align:center}
.nav button i{font-style:normal;font-size:21px}.nav button.on{color:var(--ac)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:406px;background:var(--card);border:2px solid var(--tx);border-radius:18px;padding:12px 14px;z-index:4}
.page{padding-bottom:30px}
.bar{height:8px;background:var(--gr);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.av{image-rendering:pixelated;width:96px;height:160px;background:var(--gr);border-radius:12px;display:block;margin:0 auto}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.avb{border:3px solid transparent;background:none;border-radius:14px;padding:2px;cursor:pointer}.avb.on{border-color:var(--ac)}
.avb .av{width:100%;height:auto;aspect-ratio:3/5}

.stage .world canvas{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:none}
.hud,.demo,.ovl{z-index:3}
.luc{position:absolute;left:50%;top:60.6%;height:14.7%;aspect-ratio:134/300;transform:translateX(-50%);z-index:2}
.luc .lucimg{position:absolute;inset:0;animation:bob 1.5s ease-in-out infinite}
.luc .lsh{position:absolute;left:50%;bottom:-1%;width:100%;height:7%;background:rgba(0,0,0,.4);border-radius:50%;transform:translateX(-50%)}

.luc .bub small{font-family:var(--px);font-size:6px;color:#2f7d3b;display:block;margin-bottom:2px}

 const g=cv.getContext('2d'),w=S.clima=='cancelada'?2:S.clima=='a_confirmar'?1:0,m=S.turno=='m';
 g.setTransform(3,0,0,3,0,0);g.imageSmoothingQuality='high';g.clearRect(0,0,192,340);
 if(!(m&&w==0))LAMPS.forEach(([x,y],i)=>{const a=(w==2?.6:.4)+Math.sin(now/400+i*2)*.07,r=g.createRadialGradient(x,y,0,x,y,13);r.addColorStop(0,`rgba(255,205,110,${a})`);r.addColorStop(1,'rgba(255,205,110,0)');g.fillStyle=r;g.fillRect(x-13,y-13,26,26)});
 if(w<2){g.fillStyle=w==1?'rgba(60,65,90,.4)':m?'rgba(255,255,255,.8)':'rgba(255,170,205,.3)';for(let k=0;k<5;k++){const x=Math.round((now/(80+k*25)+k*55)%260-50),y=8+k*8;g.fillRect(x,y,26,4);g.fillRect(x+5,y-3,14,3);g.fillRect(x+16,y-2,12,3)}}
 if(m&&w==0)for(let k=0;k<2;k++){const x=Math.round((now/50+k*95)%240-24),y=Math.round(30+k*12+Math.sin(now/300+k)*3),f=Math.floor(now/200)%2;g.fillStyle='#2a2a3a';g.fillRect(x,y+f,2,1);g.fillRect(x+2,y+1-f,2,1);g.fillRect(x+4,y+f,2,1)}
 if(w!=2)who().forEach(p=>pdraw(g,p,now));
 if(w==2){g.fillStyle='rgba(190,215,235,.55)';for(let i=0;i<70;i++){const sp=50+(i%5)*14,y=(now/1000*sp+i*47)%350-8,x=((i*61)%220)-14-y*.22;g.fillRect(Math.round(x),Math.round(y),1,4)}
  g.fillStyle='rgba(210,230,245,.5)';const t=Math.floor(now/160);for(let i=0;i<16;i++){const h=(i*7919+t*104729*(i+3))%1000;g.fillRect(24+h%150,205+(h*7)%52,3,1)}}
}
draw.l=0;requestAnimationFrame(draw);

const bgKey=()=>S.clima=='cancelada'?'r':S.clima=='a_confirmar'?'c':S.turno=='m'?'m':'n';
function scene(f){const c=cnt(),cx=S.clima=='cancelada',lab=cx?'🌧 Lluvia':S.clima=='a_confirmar'?'☁️ A confirmar':S.turno=='m'?'☀️ Soleado':'🌆 Atardecer',
 say=cx?'Hoy no se entrena 🌧':S.clima=='a_confirmar'?'Miro el cielo… ☁️':(esc(S.msg)||'Los espero 💪'),age=performance.now()-S.lucT,ent=age<2600,luc=S.llamada=='abierta'?`<div class="luc${ent?' enter':''}"${ent?` style="animation-delay:-${Math.round(age)}ms"`:''}><div class="bub"><small>PROFE LUCAS</small><span class="bm">${say}</span></div><div class="lsh"></div><div class="lucimg"></div></div>`:'';if(ent){clearTimeout(S.lt);S.lt=setTimeout(R,2650-age)}
 return `<div class="stage ${f?'full':'scene'}"><div class="world" id="wd">${['n','c','r','m'].map(k=>`<div class="bg b-${k}" data-k="${k}"></div>`).join('')}<canvas id="cv" width="576" height="1020"></canvas>${luc}</div><div class="hud">${f?'<span class="pill lg">liberate</span>':''}<span class="pill">👥 ${cx?0:c.v}/${CUPO}</span><span class="pill">${lab}</span>${f&&S.llamada!='abierta'&&!cx?`<span class="pill">⏳ Hoy ${S.turno=='m'?'8:00':'19:30'}</span>`:''}${f?'<span class="pill">🔥 4</span>':''}</div>${f?`<button class="demo" onclick="S.role='profe';R()">Ver como profe</button>`:''}${cx?'<div class="ovl"><b>CLASE CANCELADA<br>POR LLUVIA</b></div>':''}</div>`}
function fit(){const st=document.querySelector('.stage'),wd=document.getElementById('wd');if(!st||!wd)return;const full=st.classList.contains('full'),W=st.clientWidth,H=st.clientHeight;let s,top;
 if(full){const lim=H-222;s=Math.min(W*1.45/192,Math.max(W*1.2/192,H/340*1.02,(H-lim)/80));top=Math.min(0,Math.max(H-340*s,lim-260*s))}else{s=W*1.1/192;top=H/2-215*s}
 wd.style.cssText=`width:${192*s}px;height:${340*s}px;top:${top}px`}
function bgSync(){const k=bgKey();if(!S.pb)S.pb=k;document.querySelectorAll('.bg').forEach(e=>e.style.opacity=e.dataset.k==S.pb?1:0);void document.body.offsetWidth;requestAnimationFrame(()=>{document.querySelectorAll('.bg').forEach(e=>e.style.opacity=e.dataset.k==k?1:0);S.pb=k})}
addEventListener('resize',fit);

/* ---------- Alumno (app con barra inferior) ---------- */
const TABS=[['hoy','☀️','HOY'],['lib','📅','MI LIBERATE'],['casa','🏋️','ENTRENAR EN CASA'],['perfil','👤','PERFIL']];
const RT=[{n:'Circuito express',lv:'Intermedio',eq:'Sin equipo',ex:['Sentadillas','Flexiones','Mountain climbers','Plancha','Burpees','Zancadas']},{n:'Tren inferior',lv:'Principiante',eq:'Sin equipo',ex:['Sentadilla sumo','Puente de glúteos','Zancadas alternas','Sentadilla con salto','Elevación de talones','Sentadilla isométrica','Patada de glúteo','Estocada lateral']},{n:'Movilidad y elongación',lv:'Todos',eq:'Colchoneta',ex:['Rotación de cadera','Gato y vaca','Estocada con giro','Estiramiento de isquios','Postura del niño']}];
const nav=()=>`<nav class="nav">${(S.role=='profe'?PT:TABS).map(([k,i,l])=>`<button class="${(S.role=='profe'?S.ptab:S.tab)==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('')}</nav>`;
function go(t){if(S.role=='profe'){if(t=='salir'){S.role='alumno';S.tab='hoy'}else S.ptab=t}else S.tab=t;clearInterval(S.iv);S.run=null;S.rut=null;R();scrollTo(0,0)}
const pg=(t,b)=>`<div class="page"><header><div class="logo">liber<span>ate</span></div><button class="mini" onclick="S.role='profe';R()">Ver como profe</button></header><h2 style="margin-bottom:10px">${t}</h2>${b}</div>`;
const alumno=()=>(S.tab=='hoy'?hoy():S.tab=='lib'?lib():S.tab=='casa'?casa():perfil())+nav();
const stp=()=>S.mi=='voy'?'Voy':S.mi=='no_voy'?'No voy':'Esperado';

function hoy(){const x=S.clima,ab=S.llamada=='abierta',cx=x=='cancelada',hr=fh((S.ag.cells['2-'+S.turno]||{h:S.turno=='m'?'8:00':'19:30'}).h);
 return scene(1)+(!ab?'':`<div class="sheet"><div class="row t"><span><b>Mié ${hr}</b> · ${(S.ag.cells['2-'+S.turno]||{p:'Plaza'}).p}</span><span class="pill ${cx?'p-no':ab?'p-ok':'p-gr'}">${cx?'Cancelada':ab?'Llamada abierta':'Esperado'}</span></div>`
 +(x=='a_confirmar'?`<div class="t2">☁️ Clima en duda · el profe confirma pronto</div>`:'')
 +(cx?`<div class="t2">No se descuenta de tu plan.</div>`:`<div class="duo"><button class="btn ${S.mi=='voy'?'ok sel':''}" onclick="mi('voy')">✔ Voy</button><button class="btn ${S.mi=='no_voy'?'no sel':''}" onclick="mi('no_voy')">✖ No voy</button></div>`)
 +`</div>`)}

function lib(){const [i,k]=S.sel.split('-'),d=+i,free=25-(6+d*2),N=['Lun','Mar','Mié','Jue','Vie'];
 const up=[2,3,4,0,1].flatMap(j=>['m','n'].filter(q=>S.week[j+'-'+q]).map(q=>[j,q]));
 const nxt=up.map(([j,q])=>`<div class="stu row"><div><b>${N[j]}${j<2?' (próx.)':j==HOY?' · hoy':''}</b> · ${q=='m'?'8:00 · Plaza':'19:30 · Plaza'}</div>${j==HOY&&q=='n'?`<span class="pill ${S.mi=='voy'?'p-ok':S.mi=='no_voy'?'p-no':'p-gr'}">${stp()}</span>`:'<span class="pill p-gr">Fija</span>'}</div>`).join('')||'<div class="mu">Todavía no armaste tu semana.</div>';
 return pg('Mi Liberate',`<div class="card"><h3>Próximas clases</h3>${nxt}</div>
 <div class="card"><div class="row"><h3 style="margin:0">Mi semana fija</h3><span class="pill ${nSel()>=PLAN?'p-wa':'p-ok'}">${nSel()}/${PLAN} clases</span></div>
 <div class="mu sm" style="margin-top:8px">Elegí tu turno base y se arma solo:</div>
 <div class="chips"><button class="chip" onclick="base('m')">☀️ Mañana</button><button class="chip" onclick="base('n')">🌙 Noche</button><button class="chip" onclick="base('x')">🔀 Mixto</button></div>
 <div class="grid"><div></div>${DAYS.map(x=>`<div class="h">${x}</div>`).join('')}${[['m','8:00'],['n','19:30']].map(([q,hr])=>`<div class="sm mu"><b>${hr}</b></div>`+DAYS.map((n,j)=>`<button class="cell ${S.week[j+'-'+q]?'on':''} ${S.sel==j+'-'+q?'sel':''}" onclick="tog(${j},'${q}')">${S.week[j+'-'+q]?'✔':'+'}</button>`).join('')).join('')}</div></div>
 <div class="card"><div class="row"><h3 style="margin:0">${['Lunes','Martes','Miércoles','Jueves','Viernes'][d]} · ${k=='m'?'8:00 · Plaza':'19:30 · Plaza'}</h3><span class="pill p-gr">${free} lugares libres</span></div><div class="mu sm" style="margin-top:6px">${S.week[S.sel]?'Es parte de tu semana fija.':'No es tu horario fijo. Podés sumarte como clase extra si hay lugar.'}</div>
 <button class="btn out" style="width:100%;margin-top:10px;font-size:15px" onclick="toast('Demo: te anotarías solo esta semana')">Anotarme solo esta semana</button>
 <button class="btn out" style="width:100%;margin-top:8px;font-size:15px" onclick="toast('Demo: pasarías al otro turno solo hoy')">Pasarme al otro turno solo hoy</button></div>
 <div class="note">Cambios permanentes aplican desde la semana próxima si los hacés hasta el domingo.</div>`)}
function tog(i,k){const key=i+'-'+k;S.sel=key;if(S.week[key])delete S.week[key];else{if(nSel()>=PLAN){toast('Llegaste al tope de tu plan (3 clases por semana)');R();return}S.week[key]=1}R()}
function base(t){S.week={};[0,2,4].forEach(d=>{if(t=='m'||t=='x')S.week[d+'-m']=1;if(t=='n')S.week[d+'-n']=1});if(t=='x'){delete S.week['4-m'];S.week['4-n']=1}toast('Semana armada según tu turno');R()}
function mi(v){S.mi=S.mi==v?'esperado':v;if(S.mi=='voy')S.mit=performance.now();toast(S.mi=='esperado'?'Quitaste tu respuesta':S.mi=='voy'?'Confirmado ✔':'Avisaste que no vas');R()}

function casa(){if(S.run)return runner();if(S.rut!=null)return detail();
 return pg('Entrenar en casa',`<div class="mu" style="margin-bottom:12px">Para los días que no podés venir. Hiciste ${S.casa} en casa esta semana.</div>`+RT.map((r,i)=>`<div class="card" style="cursor:pointer" onclick="S.rut=${i};R()"><div class="row"><h3 style="margin:0">${r.n}</h3><span class="pill p-gr">${r.ex.length} min</span></div><div class="mu sm">${r.lv} · ${r.eq}</div></div>`).join(''))}
function detail(){const r=RT[S.rut];return pg(r.n,`<div class="card"><div class="mu sm" style="margin-bottom:8px">40 s de trabajo · 20 s de pausa · ${r.lv} · ${r.eq}</div>${r.ex.map((e,i)=>`<div class="stu"><b>${i+1}.</b> ${e}</div>`).join('')}</div><button class="btn ac" style="width:100%" onclick="start()">▶ Empezar</button><button class="btn out" style="width:100%;margin-top:8px;font-size:15px" onclick="S.rut=null;R()">Volver</button>`)}
function start(){S.run={i:0,left:40,rest:false,done:0};clearInterval(S.iv);S.iv=setInterval(tick,1000);R()}
function tick(){const r=S.run;if(!r)return;r.left--;if(r.left<0){const n=RT[S.rut].ex.length;if(!r.rest&&r.i==n-1){r.done=1;clearInterval(S.iv);S.casa++}else if(!r.rest){r.rest=true;r.left=20}else{r.i++;r.rest=false;r.left=40}}R()}
function runner(){const r=S.run,ex=RT[S.rut].ex;
 if(r.done)return pg('¡Listo!',`<div class="card" style="text-align:center"><div style="font-size:48px">💪</div><h2>Entrenamiento completo</h2><div class="mu">Llevás ${S.casa} entrenamiento en casa esta semana.</div></div><button class="btn ac" style="width:100%" onclick="S.run=null;S.rut=null;R()">Volver</button>`);
 return pg(RT[S.rut].n,`<div class="card" style="text-align:center"><div class="mu sm">Ejercicio ${r.i+1} de ${ex.length}</div><h2 style="margin:6px 0">${r.rest?'Pausa':ex[r.i]}</h2><div style="font-family:var(--px);font-size:56px;color:${r.rest?'var(--wa)':'var(--ac)'};margin:14px 0">${r.left}</div><div class="bar"><i style="width:${(r.i+(r.rest?1:0))/ex.length*100}%"></i></div><div class="mu sm">${ex[r.i+1]?'Sigue: '+ex[r.i+1]:'¡Último ejercicio!'}</div></div><button class="btn out" style="width:100%;font-size:15px" onclick="clearInterval(S.iv);S.run=null;R()">Terminar</button>`)}

const CH=['Ella','Él'];
function perfil(){const u=9,t=12;
 return pg('Perfil',`<div class="card" style="padding:10px 12px"><div class="row"><h3 style="margin:0;font-size:14px">Tu personaje</h3><span class="mu sm">deslizá para ver más</span></div><div class="car">${CH.map((n,i)=>`<button class="chr ${S.av==i?'on':''}" onclick="S.av=${i};R()"><span class="sp sp${i}"></span><i>${n}</i></button>`).join('')}</div></div>
 <div class="card"><div class="row"><h3 style="margin:0">Mi membresía</h3><span class="pill p-ok">Activa</span></div><div style="font-size:18px;font-weight:700;margin-top:8px">Plan 3 clases por semana</div><div class="mu sm">Vence el 30/11</div><div class="row" style="margin-top:12px"><span class="sm">Clases del mes</span><b>${u}/${t}</b></div><div class="bar"><i style="width:${u/t*100}%"></i></div><div class="sm" style="margin-top:10px">🔥 Racha: 4 semanas cumpliendo tu plan</div>
 <div class="big" style="margin-top:12px"><button class="btn out" style="font-size:15px;padding:12px" onclick="toast('Demo: pausar plan')">Pausar plan</button><button class="btn ac" style="font-size:15px;padding:12px" onclick="toast('Demo: renovar cuota')">Renovar</button></div></div><button class="btn out" style="width:100%;font-size:14px;padding:11px" onclick="S.role='login';R()">🔐 Acceso profes</button>`)}
function avs(){document.querySelectorAll('canvas.av').forEach(c=>{person(c.getContext('2d'),{x:c.width/2,y:c.height-4,u:+c.dataset.u,seed:+c.dataset.s,t:0,id:0},1e6)})}

/* ---------- Profe ---------- */
function profe(){
 const c=cnt(),ab=S.llamada=='abierta';
 let h=scene(0)+`<div class="card"><div class="row"><span class="mu sm">Miércoles · hoy</span><span class="pill ${ab?'p-ok':'p-gr'}">${ab?'Llamada abierta':'Sin abrir'}</span></div><h2>${agT()}</h2><div class="mu">Cupo ${CUPO} · ${c.t} alumnos esperados</div><div class="chips" style="margin:10px 0 0"><button class="chip ${S.turno=='m'?'on':''}" onclick="S.turno='m';R()">☀️ Turno 8:00</button><button class="chip ${S.turno=='n'?'on':''}" onclick="S.turno='n';R()">🌙 Turno 19:30</button></div>`;
 if(S.clima=='cancelada')h+=`<div class="alert" style="background:var(--nob);color:var(--no)">Cancelada por lluvia. Se avisó a todos y no se descuenta.</div><button class="btn out" style="width:100%;margin-top:10px" onclick="S.clima='normal';R()">Deshacer</button>`;
 else{
  if(!ab)h+=`<button class="btn ac" style="width:100%;margin-top:14px" onclick="S.llamada='abierta';S.lucT=performance.now();toast('Llamada abierta · push enviado');R()">📣 Abrir llamada de hoy</button>`;
  else h+=`<div class="cnt"><div style="background:var(--okb);color:var(--ok)"><b>${c.v}</b><span>Voy</span></div><div style="background:var(--nob);color:var(--no)"><b>${c.n}</b><span>No voy</span></div><div style="background:var(--gr);color:var(--mu)"><b>${c.s}</b><span>Sin respuesta</span></div></div>
   <label class="mu sm">Mensaje en la burbuja de Lucas</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">${['Hoy toca abdomen 🔥','Hoy hay burpees 😅','Circuito de piernas 🦵','Traigan agua 💧'].map(m=>`<button class="mini ${S.msg==m?'on':''}" onclick="S.msg='${m}';R()">${m}</button>`).join('')}</div><textarea rows="2" maxlength="60" placeholder="Escribí tu mensaje del día…" oninput="S.msg=this.value;const b=document.querySelector('.bm');if(b)b.textContent=this.value||'Los espero 💪'">${S.msg}</textarea>
   <a class="btn" style="margin-top:10px;background:#25a244;color:#fff" target="_blank" rel="noopener" href="${waLink()}">Compartir en WhatsApp</a>
   <button class="btn out" style="width:100%;margin-top:8px;font-size:14px;padding:12px" onclick="sim()">🎲 Simular llegada de alumnos (demo)</button>
   <button class="btn out" style="width:100%;margin-top:8px;font-size:14px;padding:12px" onclick="toast('Recordatorio enviado a '+cnt().s+' alumnos')">🔔 Recordar a los que no respondieron</button>`;
  h+=`<h3 style="margin-top:16px">Clima</h3><div class="big" style="margin-top:0"><button class="btn out" style="font-size:14px;padding:12px" onclick="S.clima=S.clima=='a_confirmar'?'normal':'a_confirmar';R()">☁️ A confirmar</button><button class="btn no" style="font-size:14px;padding:12px" onclick="if(confirm('¿Cancelar la clase por lluvia?')){S.clima='cancelada';toast('Push enviado a todos');R()}">⛈ Cancelar</button></div>`}
 h+=`</div>`;
 if(ab&&S.clima!='cancelada'){const rows=[{n:'Vos (alumno demo)',st:S.mi,a:S.meA,me:1},...S.al];
  h+=`<div class="card"><h3>Lista de alumnos</h3>`+rows.map((x,i)=>`<div class="stu row"><div><b>${x.n}</b><div><span class="pill ${x.st=='voy'?'p-ok':x.st=='no_voy'?'p-no':'p-gr'}">${x.st=='voy'?'Voy':x.st=='no_voy'?'No voy':'Esperado'}</span></div></div><button class="mini ${x.a?'on':''}" onclick="asis(${i})">${x.a?'✔ Vino':'Marcar asistencia'}</button></div>`).join('')+`</div>`}
 return h}
function asis(i){if(i==0)S.meA=!S.meA;else S.al[i-1].a=!S.al[i-1].a;R()}
function sim(){S.al.forEach((x,i)=>{if(x.st=='esperado'&&Math.random()<.65){x.st=Math.random()<.82?'voy':'no_voy';x.t=performance.now()+i*150}});R()}

const PT=[['hoy','☀️','HOY'],['agenda','🗓️','MI AGENDA'],['salir','🚪','SALIR']],AGD=['Lun','Mar','Mié','Jue','Vie'];
const fh=h=>(h||'').replace(/^0/,''),esc=t=>(t||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function agT(){const c=S.ag.cells['2-'+S.turno];return c?`${fh(c.h)} hs · ${c.p}`:'Sin clase programada'}
function agSel(k){const a=S.ag;if(a.multi){const i=a.sel.indexOf(k);i<0?a.sel.push(k):a.sel.splice(i,1)}else a.sel=[k];const c=a.cells[a.sel[0]];if(c)a.d={...c};R()}
function agApply(){const a=S.ag;a.sel.forEach(k=>{a.cells[k]={...a.d}});toast(a.sel.length+' clase(s) guardada(s)');a.sel=[];R()}
function agDel(){const a=S.ag;a.sel.forEach(k=>delete a.cells[k]);toast('Clase(s) quitada(s)');a.sel=[];R()}
function agenda(){const a=S.ag,n=Object.keys(a.cells).length;
 return `<h2 style="margin-bottom:4px">Mi agenda</h2><div class="mu sm" style="margin-bottom:10px">${n} clases por semana · 🔁 fija · 📌 solo esta semana</div>
 <div class="card"><div class="row"><h3 style="margin:0">Semana</h3><button class="mini ${a.multi?'on':''}" onclick="S.ag.multi=!S.ag.multi;S.ag.sel=[];R()">☑ Seleccionar varias</button></div>
 <div class="grid" style="margin-top:12px"><div></div>${AGD.map(d=>`<div class="h">${d}</div>`).join('')}${[['m','☀️'],['n','🌙']].map(([q,ic])=>`<div class="sm mu">${ic}</div>`+AGD.map((d,j)=>{const k=j+'-'+q,c=a.cells[k];return `<button class="agc ${c?(c.f?'on':'man'):''} ${a.sel.includes(k)?'sel':''}" onclick="agSel('${k}')">${c?`<b>${fh(c.h)}</b>${c.p}<span>${c.f?'🔁':'📌'}</span>`:'+'}</button>`}).join('')).join('')}</div></div>`
 +(a.sel.length?`<div class="card"><h3>${a.sel.length==1?'Editar clase':a.sel.length+' clases seleccionadas'}</h3>
 <div class="mu sm">Hora</div><input type="time" class="inp" value="${(a.d.h.length<5?'0':'')+a.d.h}" oninput="S.ag.d.h=this.value">
 <div class="mu sm" style="margin-top:10px">Lugar</div><div class="chips" style="margin:6px 0 0">${['Plaza','Gym'].map(p=>`<button class="chip ${a.d.p==p?'on':''}" onclick="S.ag.d.p='${p}';R()">${p=='Plaza'?'🌳 Plaza · 25':'🏋️ Gym · 15'}</button>`).join('')}</div>
 <div class="mu sm" style="margin-top:10px">Repetición</div><div class="chips" style="margin:6px 0 0"><button class="chip ${a.d.f?'on':''}" onclick="S.ag.d.f=1;R()">🔁 Fija</button><button class="chip ${!a.d.f?'on':''}" onclick="S.ag.d.f=0;R()">📌 Solo esta semana</button></div>
